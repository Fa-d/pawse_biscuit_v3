# Feelings.  A mood word MEANS a face (it wins over a scenario template) and SUGGESTS the rest: the motion, the tail,
# an effect, a pose (a template or any word that means otherwise wins over those).
#   not:     the mood used when the word is negated ("not happy" -> sad)
#   weight:  how strongly the word counts (1 = normal); polite or vague words ('please', 'maybe') count less, so the
