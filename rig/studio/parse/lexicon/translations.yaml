# Other languages: a phrase as people type it -> the English words the lexicon knows.  Read before anything else,
# longest phrase first, so "feliz cumpleanos" becomes "happy birthday" and then reads like any English prompt.
# Accents may be left out ("cumpleanos" and "cumpleaños" are the same here).  Only whole words match.
# Add a language by adding its phrases; the English side must use words from this folder.

