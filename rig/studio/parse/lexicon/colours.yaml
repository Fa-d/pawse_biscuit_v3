# Colour words.  Before an item a colour paints that item ("a red scarf", "pink bow", "a mug in teal"); before
# "eyes" it colours the eyes; anywhere else it is the fur, and every shade of the fur follows it (studio/colour.py).
# A shade word just before a colour changes it: "light blue", "dark red", "pastel pink", "neon green" (core.yaml).
# Anyone can also type a colour code: "#ff6699 cat".
#
#   name: "#rrggbb"                                  the name is the word
#   name: {hex: "#rrggbb", words: [...], swatch: 1}  more words for it; swatch: offered as a colour button in the editor

