# Which mascot.  A mascot word MEANS the mascot (weight 6).  `colour:` gives the fur a colour (a name from
# colours.yaml) unless the prompt names one itself: "polar bear" is a white bear, "black cat" stays black either way.
# Mascots: python -m studio.cli --list bases.

bases:
  biscuit: {words: [fox, foxy, foxes, fox cub, kit fox, biscuit, kitsune, vixen, fennec, fennec fox, foxie, foxxy],
    means: {base: biscuit}}
  arctic_fox: {words: [arctic fox, snow fox, white fox, polar fox], means: {base: biscuit}, colour: arctic}
  silver_fox: {words: [silver fox], means: {base: biscuit}, colour: silver}
