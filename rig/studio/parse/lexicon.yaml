# words that carry no meaning for the sticker (not counted as "not understood")
stopwords: [a, an, the, and, or, but, with, while, is, are, am, be, being, was, i, im, i'm, me, my, mine, you, your, we, us, our, it, its, it's,
  he, she, they, them, this, that, these, those, of, in, on, at, to, for, from, by, as, just, some, when, after, before, about, like,
  mascot, sticker, character, guy, little, cute, one, make, create, show, showing, draw, want, need, please, give, get,
  feeling, feels, feel, looking, looks, look, being, mood, vibes, vibe, face, holding, hold, holds, has, have, having, got,
  today, now, again, all, day, time, every, really, very, so, much, too, its, there, here, out, up, over, off,
  saying, says, said, text, caption, because, cause, his, her, their, while, giving, gives, doing, does, being, kind, sort, some, bit]
negators: [not, no, never, isnt, isn't, aren't, arent, don't, dont, doesn't, doesnt, without, nor, hardly]
