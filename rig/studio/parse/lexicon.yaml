# Words -> spec slots.  Phrases match on word boundaries, longest first; a matched phrase hides the shorter ones inside it.
# Section weights decide conflicts on the same slot (higher wins; on a tie the word mentioned later wins):
#   templates 1 (templates.yaml), moods 2, actions 3, props/effects 3, poses 4, colours 4.
# `not:` names the mood used when the word is negated ("not happy" -> sad).
# Every value must be a name from studio/spec.py VOCAB; tests/test_parser.py checks that.

moods:
  happy:
    words: [happy, joy, glad, cheerful, joyful, good mood, great, awesome, yay, smile, smiling, grin, grinning, pleased, delighted, excited, lol, haha, hehe, laugh, laughing, lmao, fun, nice, amazing, best]
    set: {face: joy, tail: up, motion: bounce}
    not: sad
  content:
    words: [chill, chilling, relaxed, relax, relaxing, content, cozy, cosy, peaceful, fine]
    set: {face: smiley, tail: rest, motion: sway}
  sad:
    words: [sad, unhappy, down, depressed, upset, heartbroken, gloomy, miserable, sorry, apologize, apologise, oops, sigh, lonely]
    set: {face: worried, tail: low, motion: sway}
    not: happy
  crying:
    words: [cry, crying, cries, tears, tearful, sob, sobbing, weep]
    set: {face: worried, tail: low, motion: shiver, effects: [tear]}
  scared:
    words: [scared, afraid, nervous, anxious, worried, panic, panicking, stressed, stress, terrified, fear, yikes, awkward, sweating]
    set: {face: worried, tail: low, motion: shiver, effects: [sweat]}
    not: content
  tired:
    words: [tired, sleepy, exhausted, drained, sluggish, drowsy, yawn, yawning, burnt out, burned out, lazy, meh, ugh, bored, boring]
    set: {face: sleep, stance: sit, motion: sleep}
    not: happy
  asleep:
    words: [sleep, sleeping, asleep, nap, napping, snooze, zzz, bedtime, bed, dreaming]
    set: {face: sleep, stance: sit, motion: sleep, effects: [zzz]}
  surprised:
    words: [surprised, shocked, wow, omg, whoa, woah, no way, unbelievable, mind blown, gasp]
    set: {face: surprised, tail: up, motion: jump}
  curious:
    words: [curious, wonder, wondering, hmm, hmmm, confused, puzzled, question, huh]
    set: {face: curious, motion: think, effects: [thought]}
  focused:
    words: [focused, determined, serious, busy, grind, grinding, hustle, productive, concentrate]
    set: {face: focused, motion: idle}
  angry:
    words: [angry, mad, grumpy, annoyed, furious, angry face, rage, raging, irritated, pissed, hate, hmph, grr, grrr, frustrated]
    set: {face: angry, motion: "no", effects: [anger]}
    not: content
  wink:
    words: [wink, winking, winks, flirty, flirt, flirting, cheeky, sneaky, wink wink]
    set: {face: wink, motion: idle}
  calm:
    words: [calm, zen, meditate, meditating, meditation, mindful, breathe, breathing, serene, inner peace]
    set: {face: calm, stance: lotus, motion: sway, effects: [aura]}
  love:
    words: [love, loving, in love, adore, crush, sweet, xoxo, romantic, valentine, valentines, kiss, kisses, hug, hugs, miss you]
    set: {face: joy, tail: up, motion: bounce, effects: [hearts]}
  shy:
    words: [shy, blush, blushing, embarrassed, ashamed, cringe, facepalm, hide, hiding, peekaboo, peek a boo]
    set: {face: worried, motion: hide}

actions:
  wave:
    words: [wave, waving, waves, hello, hi, hey, hiya, howdy, greet, greeting, bye, goodbye, see you, see ya, cya, welcome]
    set: {motion: wave, face: smiley}
  jump:
    words: [jump, jumping, jumps, hop, hopping, leap, bounce, bouncing]
    set: {motion: jump}
  cheer:
    words: [cheer, cheering, celebrate, celebrating, celebration, hooray, hurray, woohoo, win, winning, won, victory, congrats, congratulations, go team, lets go, let's go]
    set: {motion: cheer, face: joy, effects: [sparkles]}
  dance:
    words: [dance, dancing, dances, party, partying, groove, grooving, boogie, music, song, singing, sing, weekend, friday]
    set: {motion: dance, face: joy, effects: [notes]}
  walk:
    words: [walk, walking, on my way, omw, coming, going, leaving, stroll, running late, late, run, running]
    set: {motion: walk}
  nod:
    words: [yes, yep, yeah, yup, thumbs up, thumb up, approve, agree, agreed, sure, deal, nod, nodding, got it, understood, approved]
    set: {motion: nod, face: smiley}
  no:
    words: [nope, nah, disagree, refuse, no thanks, no thank you, never, shake head, shaking head]
    set: {motion: "no", face: focused}
  shiver:
    words: [shiver, shivering, cold, freezing, chilly, trembling, shaking]
    set: {motion: shiver, face: worried}
  think:
    words: [think, thinking, thoughts, idea, pondering, considering, deciding, plan, planning, brainstorm]
    set: {motion: think, face: curious, effects: [thought]}
  wait:
    words: [wait, waiting, patiently, standing by, chilling out]
    set: {motion: idle}

props:
  phone:
    words: [phone, call, calling, call me, text, texting, message, messaging, dm, mobile, scrolling, selfie, stats, stocks]
    set: {props: [phone]}
  bell:
    words: [bell, ring, ringing, reminder, remind, alarm, notification, ding, attention, announcement, dinner time]
    set: {props: [bell]}
  clipboard:
    words: [clipboard, report, chart, checklist, todo, to do, list, homework, study, studying, exam, work, working, office, meeting, deadline, task, tasks]
    set: {props: [clipboard]}
  badge:
    words: [badge, medal, award, achievement, trophy, winner, champion, proud, first place, unlocked, level up, goal, milestone]
    set: {props: [badge]}
  cloud:
    words: [balloon, cloud, done, finished, complete, completed, saved, synced, upload, uploaded]
    set: {props: [cloud]}
  gift:
    words: [gift, present, surprise, unboxing, birthday present]
    set: {props: [gift]}
  mug:
    words: [coffee, tea, mug, cup, latte, espresso, cocoa, hot chocolate, caffeine, morning brew, drink, drinking]
    set: {props: [mug]}
  heart:
    words: [heart, holding a heart, for you, sending love, thank you, thanks, thx, ty, appreciate, grateful]
    set: {props: [heart]}

effects:
  sparkles: {words: [sparkle, sparkles, sparkly, shiny, shine, magic, magical, glitter, stars, star], set: {effects: [sparkles]}}
  confetti: {words: [confetti, fireworks, festive, new year, happy new year], set: {effects: [confetti]}}
  rain: {words: [rain, raining, rainy, storm, stormy, bad day, gloomy day, wet], set: {effects: [rain]}}
  notes: {words: [notes, melody, tune, beat, dj], set: {effects: [notes]}}
  orbs: {words: [orbs, lights, glow, glowing], set: {effects: [orbs]}}
  aura: {words: [aura, halo], set: {effects: [aura]}}

poses:
  sit:
    words: [sit, sitting, sits, seated, sat, sitting down, on the floor]
    set: {stance: sit}
  stand:
    words: [stand, standing, stands, on its feet, standing up]
    set: {stance: stand}
  lotus:
    words: [cross legged, crossed legs, lotus, yoga]
    set: {stance: lotus}
  wide:
    words: [legs apart, wide stance, power pose, superhero pose]
    set: {stance: wide}
  hands_up:
    words: [hands up, arms up, paws up, raise hands, raising hands, raised arms, hands in the air]
    set: {arm_L: cheer, arm_R: cheer}
  hands_hips:
    words: [hands on hips, paws on hips, hands on waist, sassy, confident, boss]
    set: {arm_L: hip, arm_R: hip}
  cover_eyes:
    words: [cover eyes, covering eyes, covers eyes, cant look, can't look, no look]
    set: {motion: hide}
  thumbs:
    words: [hand on chin, chin, thinking pose]
    set: {arm_R: chin}
  belly:
    words: [hungry, starving, full, ate too much, food coma, tummy, belly]
    set: {arm_L: belly, arm_R: belly}
  cheeks:
    words: [cheeks, squish, squishy, aww, awww, adorable]
    set: {arm_L: cheek, arm_R: cheek, face: joy}

# which mascot (weight 4)
bases:
  biscuit: {words: [fox, foxy, foxes, biscuit], set: {base: biscuit}}
  mochi: {words: [cat, cats, kitty, kitten, kitteh, kitties, mochi, meow, neko, puss], set: {base: mochi}}
  bruno: {words: [bear, bears, teddy, teddy bear, bruno, cub, bear cub], set: {base: bruno}}

# things the mascot wears (weight 3; collected like props)
accessories:
  party_hat: {words: [party hat, birthday hat, hat, cone hat, party hats], set: {accessories: [party_hat]}}
  crown: {words: [crown, king, queen, princess, prince, royal, royalty, tiara, boss baby], set: {accessories: [crown]}}
  glasses: {words: [glasses, spectacles, specs, nerd, nerdy, geek, geeky, smart, reading, bookworm], set: {accessories: [glasses]}}
  sunglasses: {words: [sunglasses, shades, sunnies, cool, swag, summer, beach, deal with it], set: {accessories: [sunglasses]}}
  bow: {words: [bow, ribbon, hair bow, pretty], set: {accessories: [bow]}}
  flower: {words: [flower, flowers, spring, blossom, daisy, floral], set: {accessories: [flower]}}
  headphones: {words: [headphones, headset, earphones, listening, podcast, gaming, gamer], set: {accessories: [headphones]}}
  scarf: {words: [scarf, winter, snow, snowy, wintery, autumn, fall vibes], set: {accessories: [scarf]}}
  star_clip: {words: [hair clip, star clip, clip], set: {accessories: [star_clip]}}

intensity:
  strong: [very, super, so, extremely, really, totally, mega, ultra, incredibly, insanely, crazy, so much, too]
  weak: [slightly, a bit, a little, kinda, kind of, somewhat, sorta, barely, mildly, little]

