# Scenario recipes: one phrase -> a complete sticker.  They are the base layer (weight 1): any word in the prompt that
# says otherwise wins ("sleepy birthday" keeps the birthday props but takes the sleepy face).
# `caption` is only suggested; it is used when the prompt has no caption of its own and auto captions are on.

