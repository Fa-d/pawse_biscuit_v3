# Scenario recipes: a phrase -> a whole sticker.  A template is the base layer (weight 3): any word in the prompt
# that MEANS something else wins ("sleepy birthday" keeps the birthday things and takes the sleepy face), and a
# template wins over what words merely suggest.  When several templates match, the one whose phrases cover the most
# words wins, then the one mentioned first.
#   words:    the first one is the idea shown in the editor; every test checks it picks this template
#   spec:     slots from studio/spec.py, names from the registry (python -m studio.cli --list ...)
#   caption:  suggested text, used when the prompt has none and auto captions are on
# A motion that acts with something brings it by itself (sip -> a mug, eat -> the mascot's favourite snack), so a
# recipe only names a prop when it wants a particular one.

