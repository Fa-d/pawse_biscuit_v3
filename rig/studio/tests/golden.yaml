# Real-world prompts and what a sticker for them must show.  Only the listed slots are checked: a scalar must be the
# value (or one of a list of values); props/effects/accessories must include the items; `not:` lists what must NOT
# be there.  Run:  python3 -m studio.tests.eval_parser      (target: 95 % or more without the LLM)

